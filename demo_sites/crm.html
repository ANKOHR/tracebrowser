<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TraceCRM Demo</title><style>body{font:16px Arial;background:#f4f7fb;color:#182536;margin:0;padding:40px}.shell{max-width:760px;margin:auto;background:white;border:1px solid #d7e0ea;border-radius:12px;padding:28px;box-shadow:0 10px 30px #0c203010}label{display:block;margin:16px 0 6px;font-weight:700}input,select,button{font:inherit;padding:10px;border:1px solid #b7c5d4;border-radius:6px}input,select{width:100%;box-sizing:border-box}button{background:#1769e0;color:white;border:0;cursor:pointer;margin-top:18px}.card{background:#eef6ff;border:1px solid #9fc6ff;border-radius:8px;padding:14px;margin-top:20px}.success{color:#087443;font-weight:700;margin-top:16px}</style></head>
<body><main class="shell"><p>TRACECRM / SYNTHETIC FIXTURE</p><h1>Customer record</h1><label for="customer-search">Search customer</label><input id="customer-search" placeholder="Company name"><button data-testid="search-customer" type="button" onclick="searchCustomer()">Search</button><section id="customer-card" class="card" hidden><strong>Acme Ltd</strong><p>Customer ID: CRM-0042 · London</p><label for="status">Lifecycle status</label><select id="status"><option value="new">New</option><option value="qualified">Qualified</option><option value="won">Won</option></select><button data-testid="submit-crm" type="button" onclick="saveCustomer()">Save customer</button><p id="success" class="success" hidden>Saved successfully</p></section></main><script>function searchCustomer(){if(document.querySelector('#customer-search').value.toLowerCase().includes('acme'))document.querySelector('#customer-card').hidden=false}function saveCustomer(){document.querySelector('#success').hidden=false}</script></body></html>
