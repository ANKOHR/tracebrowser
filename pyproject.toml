[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracebrowser"
version = "0.1.0"
description = "Reliable, replayable browser automation with evidence for every action."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pillow>=10,<12",
  "playwright>=1.48,<2",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]
worker = [
  "dramatiq[redis]>=1.17,<2",
]

[project.scripts]
tracebrowser = "tracebrowser.cli:main"

[tool.setuptools.packages.find]
include = ["tracebrowser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: exercises the local synthetic demo websites with Playwright",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
